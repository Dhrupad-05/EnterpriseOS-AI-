[project]
name = "enterpriseos-ai"
version = "0.1.0"
description = "The Operating System for Autonomous Enterprises"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115.0", "uvicorn[standard]>=0.30.0", "sqlalchemy[asyncio]>=2.0.36", "asyncpg>=0.30.0", "alembic>=1.14.0", "pydantic>=2.10.0", "pydantic-settings>=2.6.0", "email-validator>=2.2.0", "redis>=5.2.0", "python-jose[cryptography]>=3.3.0", "passlib[bcrypt]>=1.7.4", "httpx>=0.28.0", "tenacity>=9.0.0", "structlog>=24.4.0", "prometheus-client>=0.21.0", "langgraph>=0.2.60", "langchain-core>=0.3.25", "google-generativeai>=0.8.3", "pytest>=8.3.0", "pytest-asyncio>=0.24.0", "pytest-cov>=6.0.0", "ruff>=0.8.0", "mypy>=1.13.0", "aiosqlite>=0.20.0"]
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["F"]
[tool.coverage.run]
omit = ["app/config/*","app/core/logging.py","app/core/security.py","app/db/*","app/main.py","app/health/*","app/observability/*","app/notifications/*"]
